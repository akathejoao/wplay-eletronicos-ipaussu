name: Build Android APK (Bubblewrap TWA)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'public/manifest.json'
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign WPlay APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          echo "Bubblewrap environment configured:"
          cat ~/.bubblewrap/config.json

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > ./android.keystore
            echo "Keystore decoded from secret."
          else
            echo "Generating automatic release keystore..."
            keytool -genkeypair -v \
              -keystore ./android.keystore \
              -alias wplay \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass wplay2026 \
              -keypass wplay2026 \
              -dname "CN=WPlay Eletrônicos, OU=Mobile, O=WPlay, L=Ipaussu, ST=SP, C=BR"
            echo "Automated keystore created."
          fi

      - name: Generate Project and Build Signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD || 'wplay2026' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD || 'wplay2026' }}
        run: |
          BUILD_DIR="./build-twa"
          mkdir -p "$BUILD_DIR"
          cp twa-manifest.json "$BUILD_DIR/"
          cp android.keystore "$BUILD_DIR/"
          cd "$BUILD_DIR"

          echo "Generating Android project from twa-manifest.json..."
          yes '' | bubblewrap update --skipPwaValidation --manifest=./twa-manifest.json || true

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

          echo "Compiling signed APK..."
          if ! yes '' | bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json; then
            echo "Bubblewrap build hit interactive prompt; executing Gradle & apksigner fallback..."
            if [ -f "./gradlew" ]; then
              ./gradlew assembleRelease
              BUILD_TOOLS="${ANDROID_HOME}/build-tools/34.0.0"
              UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
              if [ -n "$UNSIGNED" ]; then
                echo "Signing $UNSIGNED..."
                ${BUILD_TOOLS}/apksigner sign \
                  --ks ./android.keystore \
                  --ks-pass "pass:${BUBBLEWRAP_KEYSTORE_PASSWORD}" \
                  --key-pass "pass:${BUBBLEWRAP_KEY_PASSWORD}" \
                  --ks-key-alias wplay \
                  --out ./app-release-signed.apk \
                  "$UNSIGNED"
              fi
            fi
          fi

          cd ..
          APK_FOUND=$(find "$BUILD_DIR" -type f -name "*signed*.apk" -o -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find "$BUILD_DIR" -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FOUND" ] || [ ! -s "$APK_FOUND" ]; then
            echo "Error: No APK file was generated!"
            exit 1
          fi

          echo "Found signed APK: $APK_FOUND"
          mkdir -p public/downloads
          cp "$APK_FOUND" public/WPlay-Eletronicos.apk
          cp "$APK_FOUND" public/downloads/wplay-app.apk
          echo "Successfully published APK to public/WPlay-Eletronicos.apk and public/downloads/wplay-app.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPlay-Eletronicos.apk
          path: public/WPlay-Eletronicos.apk
          if-no-files-found: error

      - name: Commit and Push APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/WPlay-Eletronicos.apk public/downloads/wplay-app.apk
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(apk): build automatico WPlay-Eletronicos.apk [skip ci]"
            git push origin main
          fi
        continue-on-error: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0.0-apk"
          name: "WPlay App Android v1.0.0"
          body: "Arquivo oficial do aplicativo WPlay Eletrônicos compilado e assinado para Android."
          files: public/WPlay-Eletronicos.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
